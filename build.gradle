plugins {
	id 'net.fabricmc.fabric-loom' version "${loom}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

def minecraftVer = sc.current.version
version = "${property("mod.version")}+${minecraftVer}"

base {
	archivesName = property("mod.name")
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVer}"

	implementation "net.fabricmc:fabric-loader:${property('deps.loader')}"

	implementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric_api')}"

	include (implementation "org.meteordev:starscript:${property('deps.starscript')}")

	implementation "maven.modrinth:modmenu:${property('deps.mod_menu')}"

	implementation "maven.modrinth:yacl:${property('deps.yacl')}"
}

processResources {
	filesMatching("fabric.mod.json") {
		expand "mod_version": version,
		"mod_target": project.property("mod.target")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def collectJars = tasks.register("collectJars", Copy) {copy ->

	def task = tasks.named("jar")

	dependsOn(task)

	copy.from task
	copy.into rootProject.buildDir.path + "/libs"
}

assemble {
	dependsOn(collectJars)
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "solid-bar"
	changelog = rootProject.file("CHANGELOG.md").text
	versionNumber = version
	versionName = version
	versionType = property("mod.versionType")
	property("mod.gameVersions").split(", ").each {
		gameVersions.add it
	}
	loaders = ["fabric"]
	environment = "client_only"
	uploadFile = jar
	dependencies {
		required.project "yacl"
		required.project "fabric-api"
	}
}